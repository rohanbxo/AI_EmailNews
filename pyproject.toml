[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "AI-powered news aggregator with personalized email digests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.12.1",
    "openai>=1.40.0",
    "youtube-transcript-api>=0.6.2",
    "google-api-python-client>=2.130.0",
    "tenacity>=8.4.0",
    "jinja2>=3.1.4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
