<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AI News Digest{% endblock %}</title>
  <meta name="description" content="Daily personalized AI news digest. Curated from Anthropic, OpenAI, and YouTube channels using LLM ranking.">
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --text: #18181b;
      --text-muted: #6b7280;
      --text-subtle: #9ca3af;
      --border: #e5e7eb;
      --accent: #0f172a;
      --tag-anthropic: #ea580c;
      --tag-openai: #16a34a;
      --tag-youtube: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    a { color: var(--text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 72px; }
    header.site {
      display: flex; align-items: baseline; justify-content: space-between;
      padding-bottom: 18px; margin-bottom: 28px; border-bottom: 1px solid var(--border);
    }
    header.site h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    header.site nav a { font-size: 14px; color: var(--text-muted); margin-left: 16px; }
    header.site nav a:hover { color: var(--text); }
    h2 { font-size: 22px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: border-color 120ms, transform 120ms;
    }
    .card:hover { border-color: #cbd5e1; }
    .card .tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .tag.anthropic { color: var(--tag-anthropic); }
    .tag.openai { color: var(--tag-openai); }
    .tag.youtube { color: var(--tag-youtube); }
    .card h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 1.35; }
    .card h3 a { color: var(--text); }
    .card p { margin: 0; color: #374151; font-size: 14.5px; }
    .card .meta {
      margin-top: 10px; font-size: 12px; color: var(--text-subtle);
      display: flex; gap: 14px; flex-wrap: wrap;
    }
    .score { font-variant-numeric: tabular-nums; }
    .day-heading {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 32px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .empty {
      padding: 48px 20px; text-align: center; color: var(--text-muted);
      background: var(--surface); border: 1px dashed var(--border); border-radius: 10px;
    }
    .pagination { display: flex; justify-content: space-between; margin-top: 24px; }
    .pagination a, .pagination span {
      font-size: 14px; color: var(--text-muted); padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    }
    .pagination span { opacity: 0.4; }
    footer { margin-top: 56px; color: var(--text-subtle); font-size: 12px; text-align: center; }
    footer a { color: var(--text-muted); }
    .read-more {
      display: inline-block; font-size: 12.5px; font-weight: 500;
      color: var(--text-muted); margin-top: 10px;
    }
    .read-more::after { content: " →"; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <h1><a href="/">AI News Digest</a></h1>
      <nav>
        <a href="/">Today</a>
        <a href="/archive">Archive</a>
        <a href="https://github.com/" target="_blank" rel="noopener">Source</a>
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer>
      Curated for {{ profile.name }} · personalized via LLM ranking ·
      <a href="https://github.com/" target="_blank" rel="noopener">code on GitHub</a>
    </footer>
  </div>
</body>
</html>
