services:
  # Public read-only archive site (FastAPI).
  # Reuses the Neon Postgres database — provide DATABASE_URL as a secret.
  - type: web
    name: ai-news-web
    runtime: python
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.web.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  # Optional: also run the daily pipeline on Render (free Postgres expires in 30 days,
  # so most users keep the cron on GitHub Actions). Uncomment to use.
