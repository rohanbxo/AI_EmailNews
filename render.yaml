databases:
  - name: ai-news-db
    plan: free
    databaseName: ai_news
    user: ai_news

services:
  - type: cron
    name: ai-news-daily
    runtime: python
    plan: free
    schedule: "0 13 * * *"   # 13:00 UTC daily
    buildCommand: "pip install -e ."
    startCommand: "python main.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: WEBSHARE_USERNAME
        sync: false
      - key: WEBSHARE_PASSWORD
        sync: false
      - key: DIGEST_LOOKBACK_HOURS
        value: "24"
      - key: EMAIL_TOP_N
        value: "10"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
